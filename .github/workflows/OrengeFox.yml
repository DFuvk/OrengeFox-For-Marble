name: Recovery OFOX Build (fox_12.1) — marble

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL Orangefox'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/Ctapchuk/android_device_xiaomi_marble-OFRP'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH (repo Ctapchuk/android_device_xiaomi_marble-OFRP.)'
        required: true
        default: 'fox_12.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/xiaomi/marble'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH'
        required: false
      COMMON_TREE_BRANCH:
        description: 'COMMON_TREE_BRANCH'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'marble'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_marble'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'
      OF_MAINTAINER:
        description: 'OF_MAINTAINER'
        required: true
        default: 'Yudharn'
      FOX_MAINTAINER_PATCH_VERSION:
        description: 'FOX_MAINTAINER_PATCH_VERSION'
        required: true
        default: '1'
      HAPTIC_FEEDBACK:
        description: 'Build dengan menu Haptic feedback (patch di patches/bootable_recovery). Hapus centang = build OrangeFox biasa.'
        required: true
        type: boolean
        default: true

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    # Build normal ~1 jam (sync ~8 mnt + build ~40 mnt). Batas ini mencegah job macet menghabiskan 6 jam menit Actions.
    timeout-minutes: 240
    permissions:
      contents: write
    steps:

    # Tidak ada input workflow yang di-interpolasi langsung ke script `run:`. Semua lewat `env:` pada step
    # yang membutuhkannya, lalu dipakai sebagai "$VAR" (mencegah shell/expression injection).
    - name: Check Out
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    # Third-party actions di-pin ke SHA (bukan @main/@master/tag) karena job ini punya token contents:write.
    # SHA di bawah = versi yang jalan di build sukses 2026-10-12. Dependabot (github-actions) akan menaikkannya.
    - name: Free disk space (pre-cleanup)
      uses: jlumbroso/free-disk-space@cf1e78c50ca91e757bab3edc229027eebfc07871 # main
      with:
        preinstalled-runtimes: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    # Cleanup The Actions Workspace Using Custom Composite Run Actions
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@c2a6e4317d3de2b623ac7395b05e9d2149e8289b # main

    - name: Disk space check (setelah cleanup)
      run: |
        echo "== df -h setelah free-disk-space + slimhub =="
        df -h

    - name: Initialize workspace
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Prepare the build environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # apt-get (bukan apt) supaya tidak muncul "WARNING: apt does not have a stable CLI interface"
        # Tidak ada "apt-get upgrade": tidak dibutuhkan build, makan waktu, dan ikut memasang kernel/systemd baru
        # yang tidak akan dipakai runner ini (kernel aktif tidak berganti tanpa reboot).
        sudo -E apt-get update
        sudo -E apt-get install -yq git python3 tar aria2

        # linux-modules-extra-<kernel> hanya dipakai untuk modul zram. Paket untuk kernel image runner sering
        # sudah dihapus dari arsip Ubuntu (build 2026-11-22: kernel 7.0.0-1017-azure -> "Unable to locate package"
        # -> exit 100). Jadi opsional: kalau tidak ada, lanjut saja; langkah zram di bawah akan dilewati sendiri.
        KMOD_PKG="linux-modules-extra-$(uname -r)"
        if apt-cache show "$KMOD_PKG" >/dev/null 2>&1; then
          sudo -E apt-get install -yq "$KMOD_PKG" || echo "::notice::$KMOD_PKG gagal dipasang -- zram mungkin tidak tersedia"
        else
          echo "::notice::$KMOD_PKG tidak ada di repo apt (kernel runner $(uname -r)) -- dilewati, zram mungkin tidak tersedia"
        fi

        git clone https://gitlab.com/OrangeFox/misc/scripts.git
        cd scripts
        sudo bash setup/android_build_env.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    # problem-matcher: false -> output kompiler/build AOSP berformat "file:line: warning: ..." tidak diubah
    # jadi annotation ##[warning] (di build 2026-10-12 ini yang memunculkan 2 warning sepolicy di ringkasan run).
    # Semua output tetap ada di log; error build tetap terlihat di log dan di artifact build.log.
    - name: Install OpenJDK
      uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: '11'
        problem-matcher: false

    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.SYNC_URL, 'git@') ||
          startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@') ||
          startsWith(github.event.inputs.COMMON_TREE_URL, 'git@') }}
      uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
      with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Sync OrangeFox sources and minimal manifest
      id: sync
      env:
        SYNC_URL: ${{ github.event.inputs.SYNC_URL }}
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        git clone "$SYNC_URL" sync
        cd sync
        SYNC_COMMIT=$(git rev-parse HEAD)
        SYNC_COMMIT_DATE=$(git log -1 --format=%cI)
        SYNC_COMMIT_MSG=$(git log -1 --format=%s)
        echo "sync-commit=$SYNC_COMMIT" >> $GITHUB_OUTPUT
        echo "sync-commit-short=${SYNC_COMMIT:0:8}" >> $GITHUB_OUTPUT
        echo "== Commit repo sync yang dipakai build ini: $SYNC_COMMIT ($SYNC_COMMIT_DATE) =="
        echo "== Pesan commit: $SYNC_COMMIT_MSG =="
        echo "== Riwayat lengkap: https://gitlab.com/OrangeFox/sync/-/commits/master =="
        TARGET=${{ steps.pwd.outputs.workspace-folder }}/fox_12.1
        SYNC_LOG=${{ steps.pwd.outputs.workspace-folder }}/sync.log
        : > "$SYNC_LOG"
        success=0
        for attempt in 1 2 3 4 5; do
          echo "== Sync attempt $attempt/5 =="
          ./orangefox_sync.sh --branch 12.1 --path "$TARGET" 2>&1 | tee -a "$SYNC_LOG" || true
          if [ -f "$TARGET/build/envsetup.sh" ]; then
            success=1
            break
          fi
          echo "Sync attempt $attempt tidak menghasilkan manifest yang valid (build/envsetup.sh tidak ada). Retry in 30s..."
          sleep 30
        done
        if [ "$success" -ne 1 ]; then
          echo "::error::Semua percobaan sync gagal -- $TARGET/build/envsetup.sh tidak pernah ada."
          exit 1
        fi
        # orangefox_sync.sh tetap lanjut walau patch gagal (mis. patch-vendor-twrp-fox_12.1.diff tidak ada di repo sync).
        # Cukup dicatat di log (bukan annotation): langkah "Apply vendor/twrp soong include (fallback)" di bawah
        # menangani kasus ini dan baru memunculkan ::warning:: kalau fallback-nya sendiri gagal.
        if grep -q 'Failed to patch' "$SYNC_LOG"; then
          echo "== INFO: orangefox_sync.sh melaporkan patch gagal: $(grep -m1 -E 'Failed to patch' "$SYNC_LOG")"
          echo "== INFO: fallback untuk vendor/twrp dijalankan di langkah berikutnya =="
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Check disk & memory after sync
      if: always()
      run: |
        echo "== Disk =="
        df -h
        echo "== Memory =="
        free -h
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    # Fallback untuk patch-vendor-twrp-fox_12.1.diff yang hilang dari repo sync (build 2026-10-12: "Failed to patch
    # the twrp-12.1 vendor/twrp"). Isi patch aslinya cuma 1 baris: tambah
    #   include bootable/recovery/orangefox_soong.mk
    # sebelum "SOONG_CONFIG_NAMESPACES += twrpVarsPlugin" di vendor/twrp/config/BoardConfigSoong.mk.
    # Idempotent: tidak melakukan apa-apa kalau sudah ada, atau kalau file yang dibutuhkan tidak ada.
    - name: Apply vendor/twrp soong include (fallback)
      run: |
        TREE=${{ steps.pwd.outputs.workspace-folder }}/fox_12.1
        F="$TREE/vendor/twrp/config/BoardConfigSoong.mk"
        SOONG_MK="$TREE/bootable/recovery/orangefox_soong.mk"
        if [ ! -f "$F" ]; then
          echo "::warning::$F tidak ada -- fallback dilewati"; exit 0
        fi
        if grep -q 'orangefox_soong.mk' "$F"; then
          echo "vendor/twrp sudah meng-include orangefox_soong.mk -- tidak perlu fallback"; exit 0
        fi
        if [ ! -f "$SOONG_MK" ]; then
          echo "::warning::$SOONG_MK tidak ada -- include tidak ditambahkan (bisa bikin build error)"; exit 0
        fi
        if ! grep -q '^SOONG_CONFIG_NAMESPACES += twrpVarsPlugin' "$F"; then
          echo "::warning::anchor 'SOONG_CONFIG_NAMESPACES += twrpVarsPlugin' tidak ketemu di $F -- fallback dilewati"; exit 0
        fi
        sed -i '0,/^SOONG_CONFIG_NAMESPACES += twrpVarsPlugin/s//include bootable\/recovery\/orangefox_soong.mk\nSOONG_CONFIG_NAMESPACES += twrpVarsPlugin/' "$F"
        echo "== Hasil patch fallback =="
        grep -n -B1 -A1 'orangefox_soong.mk' "$F"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    # Kredit "By <OF_MAINTAINER>" di banner "Welcome to OrangeFox Recovery!" (TWFunc::Welcome_Message di
    # bootable/recovery/twrp-functions.cpp). Tidak ada flag build untuk ini, jadi source dipatch.
    # Teks ditulis langsung (bukan macro OF_MAINTAINER) karena twrp-functions.cpp juga dikompilasi oleh
    # twrpTarMain/Android.mk yang tidak membawa -DOF_MAINTAINER.
    # Idempotent (pakai penanda /* ofox-credit */) dan tidak menggagalkan build kalau layout source berubah.
    - name: Add maintainer credit to welcome banner
      env:
        OF_MAINTAINER: ${{ github.event.inputs.OF_MAINTAINER }}
      run: |
        F=${{ steps.pwd.outputs.workspace-folder }}/fox_12.1/bootable/recovery/twrp-functions.cpp
        CREDIT="By ${OF_MAINTAINER}"
        MARK='/* ofox-credit */'
        if [ ! -f "$F" ]; then
          echo "::warning::$F tidak ada -- kredit dilewati"; exit 0
        fi
        # Hanya karakter aman supaya tidak merusak string C / perintah awk.
        if ! printf '%s' "$OF_MAINTAINER" | grep -qE '^[A-Za-z0-9 ._@-]+$'; then
          echo "::warning::OF_MAINTAINER kosong atau berisi karakter yang tidak didukung -- kredit dilewati"; exit 0
        fi
        if grep -qF "$MARK" "$F"; then
          echo "Kredit sudah ada -- lewati"; exit 0
        fi
        N=$(grep -n 'Welcome to OrangeFox Recovery' "$F" | head -n1 | cut -d: -f1)
        if [ -z "$N" ]; then
          echo "::warning::baris 'Welcome to OrangeFox Recovery' tidak ketemu di $F -- kredit dilewati"; exit 0
        fi
        LINE=$(sed -n "${N}p" "$F")
        if ! printf '%s' "$LINE" | grep -qE ';[[:space:]]*$'; then
          echo "::warning::baris Welcome bukan statement 1 baris -- kredit dilewati"; exit 0
        fi
        INDENT=$(printf '%s' "$LINE" | sed -E 's/^([[:space:]]*).*/\1/')
        awk -v n="$N" -v ins="${INDENT}gui_print_color(\"green\", \"${CREDIT}\\\\n\"); ${MARK}" \
          'NR==n{print; print ins; next} 1' "$F" > "$F.tmp" && mv "$F.tmp" "$F"
        echo "== Kredit ditambahkan =="
        grep -n -B1 -A1 -F "$MARK" "$F"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    # Foto profil maintainer di halaman About. Theme memakai PNG persegi 192x192; bentuk bulat berasal dari
    # card.png yang digambar di atasnya (lubang transparan), jadi foto TIDAK perlu dibulatkan sendiri.
    # Sumber: assets/maintainer.png di repo ini. Kalau file tidak ada / bukan PNG 192x192, avatar bawaan dipakai.
    - name: Set maintainer avatar (About page)
      run: |
        SRC="$GITHUB_WORKSPACE/assets/maintainer.png"
        DST=${{ steps.pwd.outputs.workspace-folder }}/fox_12.1/bootable/recovery/gui/theme/portrait_hdpi/images/Default/About/maintainer.png
        if [ ! -f "$SRC" ]; then
          echo "::notice::assets/maintainer.png tidak ada di repo -- avatar bawaan dipakai"; exit 0
        fi
        if ! file "$SRC" | grep -q 'PNG image data, 192 x 192'; then
          echo "::warning::assets/maintainer.png harus PNG 192x192 ($(file -b "$SRC")) -- avatar bawaan dipakai"; exit 0
        fi
        if [ ! -f "$DST" ]; then
          echo "::warning::$DST tidak ada (layout theme berubah?) -- avatar tidak diganti"; exit 0
        fi
        cp -f "$SRC" "$DST"
        echo "== Avatar maintainer diganti =="
        file "$DST"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    # Menu "Haptic feedback" (efek Click/Tick/Pop/... per Button/Keyboard/Action + halaman tes Primitive/Compose),
    # di-port dari OrangeFox fox_16.0. Patch ada di patches/bootable_recovery/*.patch di repo ini.
    # Menu baru hanya muncul kalau HAL vibrator melaporkan dukungan efek; kalau tidak, menu Vibration lama tetap dipakai.
    # Patch yang sudah terpasang dilewati; patch yang tidak cocok lagi dengan source dilewati dengan warning (build lanjut).
    - name: Apply recovery patches (haptic feedback)
      id: haptic
      if: ${{ inputs.HAPTIC_FEEDBACK }}
      run: |
        REC=${{ steps.pwd.outputs.workspace-folder }}/fox_12.1/bootable/recovery
        shopt -s nullglob
        PATCHES=("$GITHUB_WORKSPACE"/patches/bootable_recovery/*.patch)
        if [ ${#PATCHES[@]} -eq 0 ]; then
          echo "::warning::HAPTIC_FEEDBACK dicentang tapi tidak ada patch di patches/bootable_recovery -- build tanpa haptic"
          exit 0
        fi
        OK=1
        for P in "${PATCHES[@]}"; do
          NAME=$(basename "$P")
          if git -C "$REC" apply -R --check "$P" 2>/dev/null; then
            echo "$NAME sudah terpasang -- lewati"
          elif git -C "$REC" apply --check "$P" 2>/tmp/patch.err; then
            git -C "$REC" apply "$P"
            echo "== $NAME diterapkan =="
            git -C "$REC" apply --stat "$P"
          else
            OK=0
            echo "::warning::$NAME tidak cocok dengan source bootable/recovery saat ini -- dilewati, build tanpa haptic"
            cat /tmp/patch.err
          fi
        done
        # Dibaca langkah release: judul & catatan hanya menyebut haptic kalau semua patch benar-benar terpasang
        if [ "$OK" -eq 1 ]; then
          echo "applied=true" >> "$GITHUB_OUTPUT"
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone device tree
      env:
        DEVICE_TREE_URL: ${{ github.event.inputs.DEVICE_TREE_URL }}
        DEVICE_TREE_BRANCH: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
        DEVICE_PATH: ${{ github.event.inputs.DEVICE_PATH }}
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_12.1
        git clone "$DEVICE_TREE_URL" -b "$DEVICE_TREE_BRANCH" "./$DEVICE_PATH"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    # Pasangan patch haptic untuk device tree: build HAL vibrator qcom open source (punya efek Click/Tick/Pop/...)
    # dari vendor/qcom/opensource/vibrator dan menjalankannya di samping HAL Xiaomi. Patch di patches/device_tree/.
    - name: Apply device tree patches (haptic HAL)
      id: haptic_dt
      if: ${{ inputs.HAPTIC_FEEDBACK }}
      env:
        DEVICE_PATH: ${{ github.event.inputs.DEVICE_PATH }}
      run: |
        DT=${{ steps.pwd.outputs.workspace-folder }}/fox_12.1/$DEVICE_PATH
        shopt -s nullglob
        PATCHES=("$GITHUB_WORKSPACE"/patches/device_tree/*.patch)
        if [ ${#PATCHES[@]} -eq 0 ]; then
          echo "::warning::HAPTIC_FEEDBACK dicentang tapi tidak ada patch di patches/device_tree -- HAL qcom tidak ikut dibuild"
          exit 0
        fi
        OK=1
        for P in "${PATCHES[@]}"; do
          NAME=$(basename "$P")
          if git -C "$DT" apply -R --check "$P" 2>/dev/null; then
            echo "$NAME sudah terpasang -- lewati"
          elif git -C "$DT" apply --check "$P" 2>/tmp/patch.err; then
            git -C "$DT" apply "$P"
            echo "== $NAME diterapkan =="
            git -C "$DT" apply --stat "$P"
          else
            OK=0
            echo "::warning::$NAME tidak cocok dengan device tree saat ini (branch/commit lain?) -- dilewati"
            cat /tmp/patch.err
          fi
        done
        if [ "$OK" -eq 1 ]; then
          echo "applied=true" >> "$GITHUB_OUTPUT"
        fi
        if [ ! -d "${{ steps.pwd.outputs.workspace-folder }}/fox_12.1/vendor/qcom/opensource/vibrator" ]; then
          echo "::warning::vendor/qcom/opensource/vibrator tidak ada di source -- build HAL qcom akan gagal/terlewat"
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    # Waveform efek Xiaomi untuk HAL qcom (seperti build OrangeFox fox_16.0 ctapchuk): aktifkan USE_EFFECT_STREAM dan
    # ganti effect.cpp dengan pembaca /vendor/etc/vibrator/effect_<id>.bin (file .bin dibawa patch device tree).
    # Sumber pengganti: patches/vendor_qcom_vibrator/effect.cpp. Hanya dipasang kalau layout source sesuai.
    - name: Apply qcom vibrator effect stream (haptic HAL)
      id: haptic_fx
      if: ${{ inputs.HAPTIC_FEEDBACK }}
      run: |
        V=${{ steps.pwd.outputs.workspace-folder }}/fox_12.1/vendor/qcom/opensource/vibrator
        SRC="$GITHUB_WORKSPACE/patches/vendor_qcom_vibrator/effect.cpp"
        if [ ! -f "$SRC" ]; then
          echo "::warning::patches/vendor_qcom_vibrator/effect.cpp tidak ada -- efek pakai bawaan driver"; exit 0
        fi
        if [ ! -f "$V/effect/effect.h" ] || [ ! -f "$V/aidl/Vibrator.cpp" ] || [ ! -f "$V/aidl/Android.bp" ]; then
          echo "::warning::$V tidak lengkap -- effect stream dilewati"; exit 0
        fi
        # struct effect_stream harus {effect_id, length, play_rate_hz, const int8_t *data} dan HAL harus punya jalur USE_EFFECT_STREAM
        if ! grep -qE 'const int8_t[[:space:]]*\*[[:space:]]*data;' "$V/effect/effect.h" \
           || ! grep -q 'play_rate_hz' "$V/effect/effect.h" \
           || ! grep -q 'USE_EFFECT_STREAM' "$V/aidl/Vibrator.cpp"; then
          echo "::warning::layout vendor/qcom/opensource/vibrator berbeda dari perkiraan -- effect stream dilewati"; exit 0
        fi
        cp -f "$SRC" "$V/effect/effect.cpp"
        if ! grep -q 'DUSE_EFFECT_STREAM' "$V/aidl/Android.bp"; then
          if grep -q '^Common_CFlags += \["-Werror"\]' "$V/aidl/Android.bp"; then
            sed -i '0,/^Common_CFlags += \["-Werror"\]/s//&\nCommon_CFlags += ["-DUSE_EFFECT_STREAM"] \/\/ [ofox-haptics]/' "$V/aidl/Android.bp"
          else
            sed -i '0,/^Common_CFlags = .*/s//&\nCommon_CFlags += ["-DUSE_EFFECT_STREAM"] \/\/ [ofox-haptics]/' "$V/aidl/Android.bp"
          fi
        fi
        if grep -q 'DUSE_EFFECT_STREAM' "$V/aidl/Android.bp"; then
          echo "== effect stream aktif =="
          grep -n 'Common_CFlags' "$V/aidl/Android.bp"
          echo "applied=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::gagal menambah -DUSE_EFFECT_STREAM ke $V/aidl/Android.bp"
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone common tree
      if: |
        github.event.inputs.COMMON_TREE_URL != ''
        && github.event.inputs.COMMON_PATH != ''
      env:
        COMMON_TREE_URL: ${{ github.event.inputs.COMMON_TREE_URL }}
        COMMON_PATH: ${{ github.event.inputs.COMMON_PATH }}
        COMMON_TREE_BRANCH: ${{ github.event.inputs.COMMON_TREE_BRANCH }}
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_12.1
        if [ -n "$COMMON_TREE_BRANCH" ]; then
          git clone "$COMMON_TREE_URL" -b "$COMMON_TREE_BRANCH" "./$COMMON_PATH"
        else
          git clone "$COMMON_TREE_URL" "./$COMMON_PATH"
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Workaround known-broken modules unrelated to recovery
      run: |
        TREE=${{ steps.pwd.outputs.workspace-folder }}/fox_12.1

        if [ -d "$TREE/external/se_omapi" ]; then
          rm -rf "$TREE/external/se_omapi"
          mkdir -p "$TREE/external/se_omapi"
          printf 'soong_namespace {\n}\n' > "$TREE/external/se_omapi/Android.bp"
          echo "Distub: $TREE/external/se_omapi"
        else
          echo "external/se_omapi tidak ada di fox_12.1 -- lewati"
        fi

        if [ -d "$TREE/hardware/interfaces/vibrator/aidl/default/example_java_client" ]; then
          rm -rf "$TREE/hardware/interfaces/vibrator/aidl/default/example_java_client"
          echo "Dihapus: hardware/interfaces/vibrator/aidl/default/example_java_client"
        fi

        for f in \
          bootable/recovery/openaes/src/oaes_lib.c \
          bootable/recovery/openaes/src/isaac/rand.h \
          bootable/recovery/openaes/src/isaac/rand.c
        do
          F="$TREE/$f"
          if [ -f "$F" ]; then
            if ! grep -q 'Wunknown-warning-option' "$F"; then
              sed -i '1i #pragma clang diagnostic ignored "-Wunknown-warning-option"\n#pragma clang diagnostic ignored "-Wdeprecated-non-prototype"' "$F"
              echo "Patched: $F"
            else
              echo "$F sudah dipatch sebelumnya, lewati"
            fi
          else
            echo "$F tidak ditemukan -- lewati"
          fi
        done

        # Dua warning "BOARD_PLAT_*_SEPOLICY_DIR has been deprecated" berasal dari build system AOSP sendiri, yang
        # membaca variabel lama itu untuk kompatibilitas: build/make/core/soong_config.mk (baris SystemExt*SepolicyDirs)
        # dan system/sepolicy/Android.mk (blok ifneq ... BOARD_PLAT_*). Kalau tidak ada device/vendor/bootable yang
        # MENGISI variabel itu, pembacaan tersebut selalu kosong, jadi aman dibuang (hasil build sama).
        cd "$TREE"
        SOONG_CFG=build/make/core/soong_config.mk
        SEPOLICY_MK=system/sepolicy/Android.mk
        if grep -rqE --include='*.mk' '^[[:space:]]*BOARD_PLAT_(PUBLIC|PRIVATE)_SEPOLICY_DIR[[:space:]]*[:+?]?=' device vendor bootable 2>/dev/null; then
          echo "BOARD_PLAT_*_SEPOLICY_DIR diisi oleh tree/device -- patch sepolicy dilewati (warning deprecated tetap muncul, tidak berbahaya)"
        elif [ ! -f "$SOONG_CFG" ] || [ ! -f "$SEPOLICY_MK" ]; then
          echo "::warning::$SOONG_CFG atau $SEPOLICY_MK tidak ada -- patch sepolicy dilewati"
        else
          sed -i -E 's/[[:space:]]+\$\(BOARD_PLAT_(PUBLIC|PRIVATE)_SEPOLICY_DIR\)//g' "$SOONG_CFG"
          sed -i -E '/^ifneq \(,\$\(BOARD_PLAT_(PUBLIC|PRIVATE)_SEPOLICY_DIR\)\)$/,/^endif$/d' "$SEPOLICY_MK"
          LEFT=$(grep -nE 'BOARD_PLAT_(PUBLIC|PRIVATE)_SEPOLICY_DIR' "$SOONG_CFG" "$SEPOLICY_MK" || true)
          if [ -n "$LEFT" ]; then
            echo "::warning::masih ada BOARD_PLAT_*_SEPOLICY_DIR setelah patch (layout file berbeda dari perkiraan):"
            echo "$LEFT"
          else
            echo "Patched: pembacaan BOARD_PLAT_*_SEPOLICY_DIR dibuang dari soong_config.mk dan sepolicy/Android.mk"
          fi
        fi

        # $(warning) informatif bawaan OrangeFox -> $(info): output tetap ada, tidak jadi annotation
        sed -i -E 's/\$\(warning ("FOX_MISCELLANEOUS_ROOT_DIRECTORY" is used)/$(info \1/' bootable/recovery/orangefox.mk 2>/dev/null || true
        sed -i -E 's/\$\(warning (vendor_hw:)/$(info \1/' bootable/recovery/prebuilt/Android.mk 2>/dev/null || true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # master
      with:
        swap-size-gb: 12

    - name: Enable zram swap
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # zram opsional: kalau modul kernel zram tidak ada (lihat langkah "Prepare the build environment"),
        # build tetap jalan memakai swapfile 12 GB dari langkah sebelumnya.
        if sudo modprobe zram 2>/dev/null; then
          sudo -E apt-get install -yq zram-tools
          echo -e 'ALGO=lz4\nPERCENT=50\nPRIORITY=100' | sudo tee /etc/default/zramswap
          sudo systemctl restart zramswap.service \
            || echo "::notice::zramswap.service gagal start -- lanjut dengan swapfile saja"
        else
          echo "::notice::modul zram tidak tersedia di kernel $(uname -r) -- zram dilewati, pakai swapfile saja"
        fi
        echo "== swap layout =="
        swapon --show
        free -h
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Disk space check (sebelum build)
      run: |
        echo "== df -h =="
        df -h
        echo "== 20 folder terbesar di source tree =="
        du -sh ${{ steps.pwd.outputs.workspace-folder }}/fox_12.1/* 2>/dev/null | sort -rh | head -20
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Building recovery
      env:
        IN_MAKEFILE_NAME: ${{ github.event.inputs.MAKEFILE_NAME }}
        IN_BUILD_TARGET: ${{ github.event.inputs.BUILD_TARGET }}
        OF_MAINTAINER: ${{ github.event.inputs.OF_MAINTAINER }}
        FOX_MAINTAINER_PATCH_VERSION: ${{ github.event.inputs.FOX_MAINTAINER_PATCH_VERSION }}
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_12.1
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL="C"
        # OF_MAINTAINER dan FOX_MAINTAINER_PATCH_VERSION sudah di-export lewat env: step ini.
        export OF_SCREEN_H=2400

        PRODUCT="$IN_MAKEFILE_NAME"
        VARIANT="eng"

        echo "== lunch ${PRODUCT}-${VARIANT} =="
        if ! lunch "${PRODUCT}-${VARIANT}"; then
          echo "::error::lunch ${PRODUCT}-${VARIANT} gagal. fox_12.1 seharusnya memakai format lunch lama 2-bagian -- cek apakah MAKEFILE_NAME benar terdaftar di AndroidProducts.mk tree ini, atau apakah manifest yang ter-sync ternyata bukan benar-benar fox_12.1."
          exit 1
        fi

        set -e
        set -o pipefail
        # Tidak perlu "make clean": runner baru, folder out/ belum ada.
        mka adbd "${IN_BUILD_TARGET}image" -j$(nproc --all) 2>&1 | tee ${{ steps.pwd.outputs.workspace-folder }}/build.log
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload build log (jika build gagal)
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: build-log-${{ github.run_id }}
        # sync.log ikut diupload supaya kegagalan di tahap sync juga punya log; file yang belum ada diabaikan.
        path: |
          ${{ steps.pwd.outputs.workspace-folder }}/build.log
          ${{ steps.pwd.outputs.workspace-folder }}/sync.log
        if-no-files-found: ignore
        retention-days: 7

    - name: Verify build artifacts
      id: verify
      env:
        IN_DEVICE_NAME: ${{ github.event.inputs.DEVICE_NAME }}
      run: |
        BUILD_LOG="${{ steps.pwd.outputs.workspace-folder }}/build.log"
        PRODUCT_OUT="${{ steps.pwd.outputs.workspace-folder }}/fox_12.1/out/target/product/$IN_DEVICE_NAME"

        # Release hanya berisi file .zip OrangeFox. File .img tetap dibuild tapi tidak diupload.
        ZIP_PATH=$(grep -m1 '^Recovery zip:' "$BUILD_LOG" | sed 's/^Recovery zip:[[:space:]]*//')

        # Catatan: setelah lunch, OUT_DIR berubah ke $PRODUCT_OUT, jadi hasil build ada di
        # $PRODUCT_OUT/target/product/<device>/ (path ganda). Fallback find di bawah menutupi ini.
        if [ -z "$ZIP_PATH" ] || [ ! -f "$ZIP_PATH" ]; then
          ZIP_PATH=$(find "$PRODUCT_OUT" -type f -iname 'OrangeFox-*.zip' 2>/dev/null | head -n1)
        fi

        echo "zip: ${ZIP_PATH:-<tidak ditemukan>}"

        if [ -z "$ZIP_PATH" ] || [ ! -f "$ZIP_PATH" ]; then
          echo "::error::Tidak bisa menemukan file .zip OrangeFox yang valid (lewat build.log maupun pencarian rekursif di $PRODUCT_OUT)."
          echo "== Struktur $PRODUCT_OUT sampai 3 level (untuk debug) =="
          find "$PRODUCT_OUT" -maxdepth 3 2>/dev/null
          exit 1
        fi

        echo "zip-path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
        # Versi untuk judul release, diambil dari nama zip (mis. OrangeFox-R12.0_5-Unofficial-marble.zip -> R12.0_5).
        FOX_VER=$(basename "$ZIP_PATH" | sed -nE 's/^OrangeFox-(R[^-]+)-.*/\1/p')
        echo "fox-version=${FOX_VER:-R12}" >> "$GITHUB_OUTPUT"

    - name: Upload to Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
      with:
        files: ${{ steps.verify.outputs.zip-path }}
        name: OrangeFox ${{ steps.verify.outputs.fox-version }} - ${{ github.event.inputs.DEVICE_NAME }}${{ steps.haptic.outputs.applied == 'true' && steps.haptic_dt.outputs.applied == 'true' && ' (Haptic)' || '' }}
        tag_name: ${{ github.run_id }}
        fail_on_unmatched_files: true
        body: |
          OrangeFox ${{ steps.verify.outputs.fox-version }} (unofficial) for POCO F5 / Redmi Note 12 Turbo (${{ github.event.inputs.DEVICE_NAME }}).

          **Install**
          Flash the zip from OrangeFox or TWRP. Make a backup first.

          **Notes**
          - Based on fox_12.1.
          - ${{ steps.haptic.outputs.applied == 'true' && steps.haptic_dt.outputs.applied == 'true' && 'Adds a Haptic feedback menu (Settings > Haptic feedback) with Click, Double click, Tick, Thud, Pop and Heavy click effects, using the open source qcom vibrator HAL. If that HAL fails to start, it falls back to the stock vibration settings.' || 'Standard OrangeFox vibration settings.' }}
          - No kernel included, it uses the one from your current ROM (HyperOS or GKI custom ROMs).
          - This is an unofficial build. Please don't report issues to the OrangeFox team.

          **Source**
          - Device tree: ${{ github.event.inputs.DEVICE_TREE_URL }} (`${{ github.event.inputs.DEVICE_TREE_BRANCH }}`)
          - OrangeFox sync: [`${{ steps.sync.outputs.sync-commit-short }}`](https://gitlab.com/OrangeFox/sync/-/commit/${{ steps.sync.outputs.sync-commit }})

          Maintained by ${{ github.event.inputs.OF_MAINTAINER }}.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
